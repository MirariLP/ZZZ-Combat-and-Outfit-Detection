namespace = ZZZCombatAndOutfitDetection

;==================================================
; ZZZ Combat and Outfit Detection
; Version: 0.122
;
; Made by: MirariLP
; Inspired by: https://gamebanana.com/tools/15459
;
; Namespace:
;		All persist variables are accessible under \ZZZCombatAndOutfitDetection
;
; Usage Example:
;		if $\ZZZCombatAndOutfitDetection\combatCheck == 1
;				* something *
;		endif
;==================================================

; Values for $combatCheck:
; 0: nothing identified
; 1: combat
; 2: freeroam

; Values for $belleOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: yunkui summit outfit
; 3: swimsuit outfit

; Values for $wiseOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: yunkui summit outfit
; 3: swimsuit outfit

; Values for $nicoleOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: cutie outfit

; Values for $ellenOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: school outfit

; Values for $janeOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: swimsuit outfit

; Values for $astraYaoOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: chandelier outfit

; Values for $vivianOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: swimsuit outfit

; Values for $yixuanOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: ink outfit

; Values for $panYinhuOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: culinary outfit

; Values for $yuzuhaOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: swimsuit outfit

; Values for $aliceOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: swimsuit outfit

; Values for $manatoOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: white heart outfit --;not possible to detect, because both outfits use the same hash value.

; Values for $yeShunguangOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: dawnlight outfit

; Values for $sunnaOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: maid outfit

; Values for $ariaOutfitCheck:
