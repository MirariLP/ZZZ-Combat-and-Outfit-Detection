;------------------------
; Update Log:
; v0.01 	- Added combat and freeroam check
; v0.02 	- Added Belle and Wise outfit check (default + yunkui summit)
; v0.03 	- Added compatibility with Aerospace City
; v0.04 	- Added Yuzuha and Alice outfit check (default + swimsuit)
; v0.05		- Added Belle and Wise swimsuit outfit check
; v0.06		- Added Nicole outfit check (default + cutie)
; v0.061	- Updated combat detection for version 2.2
; v0.062	- Updated combat detection for version 2.3
; v0.07		- Added Vivian outfit check (default + swimsuit)
; v0.071	- Updated combat detection for version 2.5
; v0.08		- Added Sunna outfit check (default + maid)
; v0.081	- Updated Belle's yunkui summit hash
; v0.09		- Added Jane, Astra Yao, Pan Yinhu and Manato outfit check (default + additional outfit)
; v0.10		- Added Ellen, Yixuan and Ye Shunguang outfit check (default + additional outfit)
; v0.101	- Updated temp. variable reset logic (small optimization)
; v0.11		- Added Aria outfit check (default + devil) for both human and robot
; v0.12 	- Renamed mod
; v0.121	- Updated combat detection for version 2.6
; v0.122	- Fixed aria robot outfit detection
;------------------------

