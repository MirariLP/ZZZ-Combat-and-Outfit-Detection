;==================================================
; ZZZ Combat and Outfit Detection
; Version: 0.16
;
; Made by: MirariLP
; Inspired by: https://gamebanana.com/tools/15459
;
; Namespace:
;		All persist variables are accessible under \ZZZCombatAndOutfitDetection
;
; Usage Example:
;		if $\ZZZCombatAndOutfitDetection\combatCheck == 1
;				* something *
;		endif
;==================================================

; Values for $combatCheck:
; 0: nothing identified
; 1: combat
; 2: freeroam

; Values for $belleOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: yunkui summit outfit
; 3: swimsuit outfit
; 4: roscaelifer outfit

