;------------------------
; Important!
; Some characters share the same model (hash) across multiple outfits.
; In those cases the outfits can only be differentiated via texture hashes.
; Therefore, for outfit detection to work,
; 		run = CommandList\ZZMIv1\SkinTexture
; needs to be added to the corresponding model texture override.
; Have not found a better way / unique model hash yet.
;
; Affected characters:
;		Manato

;------------------------
; Update Log:
; v0.01 	- Added combat and freeroam check
; v0.02 	- Added Belle and Wise outfit check (default + yunkui summit)
; v0.03 	- Added compatibility with Aerospace City
; v0.04 	- Added Yuzuha and Alice outfit check (default + swimsuit)
; v0.05		- Added Belle and Wise swimsuit outfit check
