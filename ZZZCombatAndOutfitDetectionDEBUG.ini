[Present]
; Combat Check
if $combatAerospaceCity == 1
	$combatCheck = 1
	;Debug
	if $debugCombatCheckEnabled == 1
		run = CommandListDebugCombatInfo
	endif
else if $freeroam == 1
	$combatCheck = 2
	;Debug
	if $debugCombatCheckEnabled == 1
		run = CommandListDebugFreeroamInfo
	endif
else if $combat == 1
	$combatCheck = 1
	;Debug
	if $debugCombatCheckEnabled == 1
		run = CommandListDebugCombatInfo
	endif
else 
	$combatCheck = 0
endif

