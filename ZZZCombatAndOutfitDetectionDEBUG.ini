; v0.09		- Added Jane, Astra Yao, Pan Yinhu and Manato outfit check (default + additional outfit)
; v0.10		- Added Ellen, Yixuan and Ye Shunguang outfit check (default + additional outfit)
; v0.101	- Updated temp. variable reset logic (small optimization)
; v0.11		- Added Aria outfit check (default + devil) for both human and robot
; v0.12 	- Renamed mod
; v0.121	- Updated combat detection for version 2.6
; v0.122	- Fixed aria robot outfit detection
; v0.123	- Fixed manato outfit detection and improved 'detection via texture hashes'
; v0.124	- Changed aria robot outfit detection hash
; v0.125	- Just when I thought that I found unique hashes for both aria robot outfits, ... but noo, the unique hash for
;							aria's default robot outfit is only unique in the skin selection....?
; v0.13		- Added Nangong Yu outfit check (default + muse)
; v0.131	- Reduced $ariaOutfitCheck to only have default and devil outfit values. Removed dedicated human/robot values, 
;							which caused a visual glitch in ultimate).
; v0.132	- Team selection screen before combat now counts as combat.
; v0.133	- Updated combat detection for version 2.8
; v0.14		- Updated for version 3.0 & added Roscaelifer Outfit detection & added Miyabi and Velina outfit detection
