;--------------------------------

; Yuzuha Outfit Check
if $yuzuhaDefaultOutfit == 1
	$yuzuhaOutfitCheck = 1
	;Debug
	if $debugOutfitCheckEnabled == 1
		run = CommandListDebugDefaultOutfitInfo
	endif
else if $yuzuhaSwimsuitOutfit == 1
	$yuzuhaOutfitCheck = 2
	;Debug
	if $debugOutfitCheckEnabled == 1
		run = CommandListDebugSwimsuitOutfitInfo
	endif
else
    $yuzuhaOutfitCheck = 0
endif
;--------------------------------

; Alice Outfit Check
if $aliceDefaultOutfit == 1
	$aliceOutfitCheck = 1
	;Debug
	if $debugOutfitCheckEnabled == 1
		run = CommandListDebugDefaultOutfitInfo
	endif
else if $aliceSwimsuitOutfit == 1
	$aliceOutfitCheck = 2
	;Debug
	if $debugOutfitCheckEnabled == 1
