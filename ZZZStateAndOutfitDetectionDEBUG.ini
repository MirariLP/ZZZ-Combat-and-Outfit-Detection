;--------------------------------

; Sunna Outfit variables
global $sunnaDefaultOutfit = 0
global $sunnaMaidOutfit = 0
global persist $sunnaOutfitCheck = 0
;--------------------------------

; Debug variables (ignore)
global $debugDistrictAndCombatCheckEnabled = 0
global $debugOutfitCheckEnabled = 1
;--------------------------------

[Present]
; District and Combat Check
if $combatAerospaceCity == 1
	$districtAndCombatCheck = 1
	;Debug
	if $debugDistrictAndCombatCheckEnabled == 1
		run = CommandListDebugCombatInfo
	endif
else if $freeroam == 1
	$districtAndCombatCheck = 2
	;Debug
	if $debugDistrictAndCombatCheckEnabled == 1
		run = CommandListDebugFreeroamInfo
	endif
else if $combat == 1
	$districtAndCombatCheck = 1
	;Debug
	if $debugDistrictAndCombatCheckEnabled == 1
		run = CommandListDebugCombatInfo
	endif
else 
    $districtAndCombatCheck = 0
endif
;--------------------------------

; Belle Outfit Check
if $belleDefaultOutfit == 1
	$belleOutfitCheck = 1
	;Debug
	if $debugOutfitCheckEnabled == 1
		run = CommandListDebugDefaultOutfitInfo
	endif
else if $belleYunkuiOutfit == 1
	$belleOutfitCheck = 2
	;Debug
	if $debugOutfitCheckEnabled == 1
		run = CommandListDebugYunkuiOutfitInfo
	endif
else if $belleSwimsuitOutfit == 1
	$belleOutfitCheck = 3
	;Debug
	if $debugOutfitCheckEnabled == 1
		run = CommandListDebugSwimsuitOutfitInfo
	endif
else
    $belleOutfitCheck = 0
endif
;--------------------------------

; Wise Outfit Check
if $wiseDefaultOutfit == 1
	$wiseOutfitCheck = 1
	;Debug
	if $debugOutfitCheckEnabled == 1
		run = CommandListDebugDefaultOutfitInfo
	endif
else if $wiseYunkuiOutfit == 1
	$wiseOutfitCheck = 2
