namespace = ZZZStateAndOutfitDetection

;==================================================
; ZZZ State and Outfit Detection
; Version: 0.081
;
; Made by: MirariLP
; Inspired by: https://gamebanana.com/tools/15459
;
; Namespace:
;   All persist variables are accessible under \ZZZStateAndOutfitDetection
;
; Usage Example:
;   if $\ZZZStateAndOutfitDetection\districtAndCombatCheck == 1
;       * something *
;   endif
;==================================================

; Values for $districtAndCombatCheck:
; 0: nothing identified
; 1: combat
; 2: freeroam

; Values for $belleOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: yunkui summit outfit
; 3: swimsuit outfit

; Values for $wiseOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: yunkui summit outfit
; 3: swimsuit outfit

; Values for $nicoleOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: cutie outfit

; Values for $vivianOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: swimsuit outfit

; Values for $yuzuhaOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: swimsuit outfit

; Values for $aliceOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: swimsuit outfit

; Values for $sunnaOutfitCheck:
; 0: nothing identified
; 1: default outfit
; 2: maid outfit

;------------------------
; Update Log:
; v0.01 	- Added combat and freeroam check
; v0.02 	- Added Belle and Wise outfit check (default + yunkui summit)
; v0.03 	- Added compatibility with Aerospace City
; v0.04 	- Added Yuzuha and Alice outfit check (default + swimsuit)
; v0.05		- Added Belle and Wise swimsuit outfit check
; v0.06		- Added Nicole outfit check (default + cutie)
; v0.061	- Updated combat detection for version 2.2
; v0.062	- Updated combat detection for version 2.3
; v0.07		- Added Vivian outfit check (default + swimsuit)
; v0.071	- Updated combat detection for version 2.5
; v0.08		- Added Sunna outfit check (default + maid)
; v0.081	- Updated Belle's yunkui summit hash
;------------------------

[Constants]
; District and Combat variables
global $combat = 0
global $combatAerospaceCity = 0
global $freeroam = 0
global persist $districtAndCombatCheck = 0
;--------------------------------

; Belle Outfit variables
global $belleDefaultOutfit = 0
global $belleYunkuiOutfit = 0
global $belleSwimsuitOutfit = 0
global persist $belleOutfitCheck = 0
;--------------------------------

; Wise Outfit variables
global $wiseDefaultOutfit = 0
global $wiseYunkuiOutfit = 0
global $wiseSwimsuitOutfit = 0
global persist $wiseOutfitCheck = 0
;--------------------------------

; Nicole Outfit variables
global $nicoleDefaultOutfit = 0
global $nicoleCutieOutfit = 0
global persist $nicoleOutfitCheck = 0
;--------------------------------

; Vivian Outfit variables
global $vivianDefaultOutfit = 0
global $vivianSwimsuitOutfit = 0
global persist $vivianOutfitCheck = 0
;--------------------------------

; Yuzuha Outfit variables
